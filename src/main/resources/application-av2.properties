# Local AV2 environment. Verification messages stay in the test inbox on this computer.
server.address=127.0.0.1
server.port=8092
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:${LOCALAPPDATA:${java.io.tmpdir}}/Entreprenly-AV2/av2-db;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
profile.verification.base-url=http://127.0.0.1:8092
profile.verification.inbox=${LOCALAPPDATA:${java.io.tmpdir}}/Entreprenly-AV2/inbox
