# Cloud profile: any host that runs the Docker image (e.g. Render) plus a managed
# PostgreSQL reachable over the network (e.g. Supabase). Everything comes from environment variables.
#
# Supabase tip: use the "Session pooler" connection details (IPv4 compatible):
#   DATABASE_HOST=aws-0-<region>.pooler.supabase.com   DATABASE_PORT=5432
#   DATABASE_USER=postgres.<project-ref>               DATABASE_NAME=postgres
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME:postgres}?sslmode=require
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
# Keep the pool small: free-tier poolers cap the number of connections.
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Render injects PORT; locally it falls back to 8092.
server.port=${PORT:8092}

authorization.jwt.secret=${JWT_SECRET}

# Public base URL shown in Swagger UI (see OpenApiConfiguration).
documentation.server.url=${PUBLIC_API_URL:http://localhost:8092}
